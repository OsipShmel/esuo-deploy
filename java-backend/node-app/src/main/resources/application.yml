spring:
  application:
    name: node-app
  config:
    import: classpath:queue-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/esuo}
    username: ${DB_USER:esuo}
    password: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true          # SSE connections and blocking JDBC for virtual threads
  task:
    scheduling:
      pool:
        size: 4              # outbox, heartbeat, domain schedulers, 'cause each task is single-threaded in itself
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
esuo:
  branch-id: ${BRANCH_ID:b01}
  branch-name: ${BRANCH_NAME:Демонстрационное отделение}
  timezone: ${BRANCH_TIMEZONE:Europe/Moscow}
  demo-data: ${DEMO_DATA:false}
  demo-mode: ${DEMO_MODE:false}                # DemoClock and demo API (load-planning.md 7.1)
  security:
    jwt-secret: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
    jwt-ttl: 12h
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  demo-users:                                # only with demo-data=true; empty password => user is not created
    operator-password: ${DEMO_OPERATOR_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  qr:                                        # hall QR: where it leads and how the code is signed
    mode: ${QR_MODE:auto}                    # center | local | auto (center while the leaf is linked to the hub)
    public-base-url: ${QR_PUBLIC_BASE_URL:}  # public center address; empty => always local
    local-base-url: ${QR_LOCAL_BASE_URL:}    # node address for the hall; empty => the address the board is opened from
    secret: ${QR_SECRET:}                    # HMAC key, >= 32 chars; required with demo-data=false
    rotation: 120s
    sticker-key-version: ${QR_STICKER_KEY_VERSION:1}   # bump to revoke printed stickers
  nats:
    url: ${NATS_URL:nats://localhost:4222}   # branch leaf; only the leaf knows the center's address
    leaf-monitor-url: ${LEAF_MONITOR_URL:}   # leaf /leafz; empty => NATS host, port 8222
    heartbeat-interval: 10s
    outbox:
      poll-interval: 200ms
      batch-size: 100
      max-backoff: 30s
      sent-retention: 24h
