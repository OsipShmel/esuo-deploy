spring:
  application:
    name: node-app
  config:
    import: classpath:queue-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/esuo}
    username: ${DB_USER:esuo}
    password: ${DB_PASSWORD:?Задайте JWT_SECRET в .env}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
esuo:
  branch-id: ${BRANCH_ID:b01}
  branch-name: ${BRANCH_NAME:Демонстрационное отделение}
  timezone: ${BRANCH_TIMEZONE:Europe/Moscow}
  demo-data: ${DEMO_DATA:false}
  security:
    jwt-secret: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
    jwt-ttl: 4h
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  demo-users:                                # работают только при demo-data=true; пустой пароль = пользователь не создаётся
    operator-password: ${DEMO_OPERATOR_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
