spring:
  jackson:
    property-naming-strategy: SNAKE_CASE   # контракт 9.1
  mvc:
    problemdetails:
      enabled: true

esuo:
  node:
    branch-id: ${BRANCH_ID}
    security:
      jwt-secret: ${JWT_SECRET}             # openssl rand -base64 32
      jwt-ttl: 5h                           # we shure to remember it
      cors-origins: ${CORS_ORIGINS:http://localhost:5173}
