spring:
  application:
    name: center-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/esuo_center}
    username: ${DB_USER:esuo}
    password: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
esuo:
  center:
    nats-url: ${NATS_URL:nats://localhost:4222}
    rpc-timeout: ${RPC_TIMEOUT:3s}              # integration.branch-rpc.timeout_ms (doc, sect 11.3)
    offline-after: 30s
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
