spring:
  application:
    name: center-app
  config:
    import: classpath:monitoring-rules.yml      # infrastructure/config, like queue-defaults.yml of the node
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/esuo_center}
    username: ${DB_USER:esuo}
    password: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true             # heartbeat flush: one multi-row INSERT instead of one per branch
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4                                 # heartbeat flush must not wait behind the config reconciler
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
esuo:
  center:
    nats-url: ${NATS_URL:nats://localhost:4222}
    logs:                                       # design 5.5-5.7: CENTER_LOG and shipping to Loki
      loki-url: ${LOKI_URL:}                    # empty => not shipped, lines wait in CENTER_LOG (7 days)
      grafana-public-url: ${GRAFANA_PUBLIC_URL:}  # for links to pulled logs; empty => no link
    security:                                   # design 4.2: everything but the public list needs NETWORK_ADMIN
      jwt-secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      admin-login: ${CENTER_ADMIN_LOGIN:network}
      admin-password: ${CENTER_ADMIN_PASSWORD:}   # empty => no account, the private API is closed
    metrics:                                    # design 6.2-6.3: heartbeats in batches, history for rules and Grafana
      flush-interval: 5s
      resolution: ${METRICS_RESOLUTION:10s}     # one row per heartbeat of an ordinary branch
      resolution-regional: ${METRICS_RESOLUTION_REGIONAL:60s}   # branches behind a regional hub (the swarm)
      retention: ${METRICS_RETENTION:48h}
      max-size: ${METRICS_MAX_SIZE:100GB}       # disk safety net: over it the oldest hours are dropped early
      max-range: 48h
    grafana:
      db-password: ${GRAFANA_DB_PASSWORD:}      # design 6.5: role grafana_ro for Grafana panels; empty => no role
    demo-mode: ${DEMO_MODE:false}               # demo stand: rule durations ×demo-duration-scale
    rpc-timeout: ${RPC_TIMEOUT:3s}              # integration.branch-rpc.timeout_ms (doc, sect 11.3)
    offline-after: 30s
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
    notify:                                     # sect 11.3
      url: ${NOTIFY_URL:http://notify-mock:8090/notify}
      connect-timeout: 2s
      request-timeout: 5s
      message-ttl: 15m                          # a late notification does harm
      max-deliver: 6
      backoff: [1s, 2s, 5s, 15s, 30s]
      circuit-breaker:
        failure-rate-threshold: 50              # %
        sliding-window-size: 10
        minimum-calls: 5
        wait-in-open-state: 30s
        # NATS redelivers everything that hit CIRCUIT_OPEN after the same wait-in-open-state delay, so on recovery a whole
        # backlog probes HALF_OPEN at once; with only 2 slots one stray failure among the burst reopens the breaker before
        # the rest even get a turn (scripts/chaos/notify-down.sh flaked on this). 5 slots make the close/reopen call less
        # sensitive to noise from a single concurrent failure.
        permitted-calls-in-half-open: 5
    mp:                                         # sect 4.6, 13.2
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      callback-url: ${MP_CALLBACK_URL:http://mp-simulator:8091/callback}
      public-url: ${CENTER_PUBLIC_URL:http://localhost:8081}
      timestamp-tolerance: 5m
      request-timeout: 5s
      max-deliver: 10
      backoff: [1s, 2s, 5s, 15s, 30s, 60s]
