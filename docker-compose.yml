# All-in-one: центр и два отделения на одной машине (для проверки жюри и разработки).
#   cp .env.example .env && docker compose up -d --build
# Профили: monitoring — мониторинг центра и сборщики логов отделений; swarm — регионы роя (с мониторингом центра);
# demo — пульт сценариев.
# Сервисы описаны по сущностям и берутся отсюда через extends: центр — deploy/center, отделение — deploy/branch
# (шаблоны services.yml), рой — deploy/swarm. Здесь только то, что нужно стенду «всё в одном»: сети, имена
# контейнеров, порты на localhost, b01 и b02, прокси связи для хаоса и пульт демо.
# Сети: каждое отделение изолировано, с центром связано только через сеть wan (как через интернет).
# Разрыв связи b01 ↔ центр:   ./scripts/chaos/cut-branch-link.sh b01   (docker network disconnect)
name: esuo

x-link: &link
  image: alpine/socat:latest
  command: ["-d", "tcp-listen:7422,fork,reuseaddr", "tcp-connect:nats-hub:7422"]
  # unless-stopped: a link cut by scripts/chaos (docker stop) stays cut, but a Docker restart or a sleeping laptop
  # does not leave both branches offline until someone notices
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ центр (deploy/center)
  nats-hub:
    extends: {file: deploy/center/docker-compose.yml, service: nats-hub}
    container_name: esuo-nats-hub
    environment:
      LEAF_ADVERTISE: center-link:7422
    ports: !override ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222", "127.0.0.1:7422:7422"]
    networks: [center, wan]

  postgres-center:
    extends: {file: deploy/center/docker-compose.yml, service: postgres-center}
    container_name: esuo-postgres-center
    networks: [center]

  center-app:
    extends: {file: deploy/center/docker-compose.yml, service: center-app}
    container_name: esuo-center-app
    ports: !override ["127.0.0.1:${CENTER_PORT:-8081}:8080", "127.0.0.1:${CENTER_MANAGEMENT_PORT:-9081}:9081"]
    networks: [center]

  notify-mock:
    extends: {file: deploy/center/docker-compose.yml, service: notify-mock}
    container_name: esuo-notify-mock
    networks: [center]

  mp-simulator:
    extends: {file: deploy/center/docker-compose.yml, service: mp-simulator}
    container_name: esuo-mp-simulator
    networks: [center]

  # Мониторинг центра: с профилем monitoring, а также с swarm — рой без графиков не замерить
  loki:
    extends: {file: deploy/center/docker-compose.yml, service: loki}
    container_name: esuo-loki
    profiles: [monitoring, swarm]
    networks: [center]

  grafana:
    extends: {file: deploy/center/docker-compose.yml, service: grafana}
    container_name: esuo-grafana
    profiles: [monitoring, swarm]
    networks: [center]

  vector-center:
    extends: {file: deploy/center/docker-compose.yml, service: vector-center}
    container_name: esuo-vector-center
    profiles: [monitoring, swarm]
    networks: [center]

  prometheus:
    extends: {file: deploy/center/docker-compose.yml, service: prometheus}
    container_name: esuo-prometheus
    profiles: [monitoring, swarm]
    networks: [center]

  nats-exporter:
    extends: {file: deploy/center/docker-compose.yml, service: nats-exporter}
    container_name: esuo-nats-exporter
    profiles: [monitoring, swarm]
    networks: [center]

  postgres-exporter:
    extends: {file: deploy/center/docker-compose.yml, service: postgres-exporter}
    container_name: esuo-postgres-exporter
    profiles: [monitoring, swarm]
    networks: [center]

  # Пульт демо-сценариев (вкладка «Сценарии» в /demo): запускает scripts/demo/run.sh и отдаёт вывод построчно.
  # Только для демо-стенда: docker compose --profile demo up -d. У контейнера сокет Docker (обрыв связи, заливка
  # данных), поэтому порт наружу не публикуется — браузер ходит через ноду под входом руководителя.
  demo-runner:
    build: tools/demo-runner
    container_name: esuo-demo-runner
    profiles: [demo]
    environment:
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
      NODE: http://node-b01:8080
      NODE2: http://node-b02:8080
      CENTER: http://center-app:8080
      MP: http://mp-simulator:8091
      NOTIFY: http://notify-mock:8090
      HUB_MONITOR: http://nats-hub:8222
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}       # сценарии ходят в закрытый API центра
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      TZ: ${BRANCH_TIMEZONE:-Europe/Moscow}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [center, b01, b02]
    restart: unless-stopped

  # ------------------------------------------------------------------ рой (deploy/swarm, план финала C1)
  # Четыре региональных leaf: docker compose --profile swarm up -d. Сам рой — java -jar с хоста (порты 4231–4234)
  # или контейнером: docker compose --profile swarm-run run --rm swarm-sim --branches 40000 --duration 10m
  nats-region-1:
    extends: {file: deploy/swarm/docker-compose.yml, service: nats-region-1}
    container_name: esuo-nats-region-1
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-2:
    extends: {file: deploy/swarm/docker-compose.yml, service: nats-region-2}
    container_name: esuo-nats-region-2
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-3:
    extends: {file: deploy/swarm/docker-compose.yml, service: nats-region-3}
    container_name: esuo-nats-region-3
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-4:
    extends: {file: deploy/swarm/docker-compose.yml, service: nats-region-4}
    container_name: esuo-nats-region-4
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  swarm-sim:
    extends: {file: deploy/swarm/docker-compose.yml, service: swarm-sim}
    container_name: esuo-swarm-sim
    profiles: [swarm-run]
    networks: [center]

  # ------------------------------------------------------------------ отделение b01 (deploy/branch)
  link-b01:
    <<: *link
    container_name: esuo-link-b01
    networks:
      b01: {aliases: [center-link]}
      wan: {}

  nats-leaf-b01:
    extends: {file: deploy/branch/services.yml, service: nats-leaf}
    container_name: esuo-nats-leaf-b01
    environment:
      LEAF_SERVER_NAME: leaf-b01
      JS_DOMAIN: branch-b01
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: ["leaf-b01-data:/data"]
    ports: ["127.0.0.1:8223:8222"]
    depends_on: [link-b01]
    networks: [b01]

  postgres-b01:
    extends: {file: deploy/branch/services.yml, service: postgres}
    container_name: esuo-postgres-b01
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["b01-db:/var/lib/postgresql/data"]
    networks: [b01]

  node-b01:
    extends: {file: deploy/branch/services.yml, service: node-app}
    container_name: esuo-node-b01
    environment:
      DB_URL: jdbc:postgresql://postgres-b01:5432/esuo
      BRANCH_ID: b01
      BRANCH_NAME: Отделение 101000 (b01)
      NATS_URL: nats://nats-leaf-b01:4222
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-${CENTER_PUBLIC_URL:-http://localhost:8081}}
      # Пульт сценариев на /demo: работает при DEMO_MODE=true и запущенном demo-runner (профиль demo)
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
    ports: ["127.0.0.1:${NODE_PORT:-8080}:8080"]
    volumes: ["b01-logs:/app/logs"]
    depends_on:
      postgres-b01: {condition: service_healthy}
      nats-leaf-b01: {condition: service_started}
    networks: [b01]

  vector-b01:
    extends: {file: deploy/branch/services.yml, service: vector}
    container_name: esuo-vector-b01
    environment: {BRANCH_ID: b01, NATS_URL: "nats://nats-leaf-b01:4222"}
    volumes: ["b01-logs:/logs:ro", "vector-b01-data:/var/lib/vector"]
    depends_on: [node-b01, nats-leaf-b01]          # том логов создаёт нода (владелец app), сборщик только читает
    networks: [b01]

  # ------------------------------------------------------------------ отделение b02 (deploy/branch)
  link-b02:
    <<: *link
    container_name: esuo-link-b02
    networks:
      b02: {aliases: [center-link]}
      wan: {}

  nats-leaf-b02:
    extends: {file: deploy/branch/services.yml, service: nats-leaf}
    container_name: esuo-nats-leaf-b02
    environment:
      LEAF_SERVER_NAME: leaf-b02
      JS_DOMAIN: branch-b02
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: ["leaf-b02-data:/data"]
    ports: ["127.0.0.1:8224:8222"]
    depends_on: [link-b02]
    networks: [b02]

  postgres-b02:
    extends: {file: deploy/branch/services.yml, service: postgres}
    container_name: esuo-postgres-b02
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["b02-db:/var/lib/postgresql/data"]
    networks: [b02]

  node-b02:
    extends: {file: deploy/branch/services.yml, service: node-app}
    container_name: esuo-node-b02
    environment:
      DB_URL: jdbc:postgresql://postgres-b02:5432/esuo
      BRANCH_ID: b02
      BRANCH_NAME: Отделение 102000 (b02)
      NATS_URL: nats://nats-leaf-b02:4222
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-${CENTER_PUBLIC_URL:-http://localhost:8081}}
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
    ports: ["127.0.0.1:8090:8080"]
    volumes: ["b02-logs:/app/logs"]
    depends_on:
      postgres-b02: {condition: service_healthy}
      nats-leaf-b02: {condition: service_started}
    networks: [b02]

  vector-b02:
    extends: {file: deploy/branch/services.yml, service: vector}
    container_name: esuo-vector-b02
    environment: {BRANCH_ID: b02, NATS_URL: "nats://nats-leaf-b02:4222"}
    volumes: ["b02-logs:/logs:ro", "vector-b02-data:/var/lib/vector"]
    depends_on: [node-b02, nats-leaf-b02]
    networks: [b02]

networks:
  center:
  wan:
  b01:
  b02:

volumes:
  hub-data:
  center-db:
  center-dumps:
  center-logs:
  vector-center-data:
  leaf-b01-data:
  b01-db:
  leaf-b02-data:
  b02-db:
  b01-logs:
  b02-logs:
  vector-b01-data:
  vector-b02-data:
  loki-data:
  grafana-data:
  prometheus-data:
