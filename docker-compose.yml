# All-in-one: центр и два отделения на одной машине (для проверки жюри и разработки).
#   cp .env.example .env && docker compose up -d --build
# Сети: каждое отделение изолировано, с центром связано только через сеть wan (как через интернет).
# Разрыв связи b01 ↔ центр:   ./scripts/chaos/cut-branch-link.sh b01   (docker network disconnect)
# Для стенда из нескольких машин — deploy/center и deploy/branch.
name: esuo

x-node-app: &node-app
  build:
    context: .
    dockerfile: java-backend/Dockerfile
    args: {MODULE: node-app}
  restart: unless-stopped

x-leaf: &leaf
  image: nats:2.10.26-alpine
  command: ["-c", "/etc/nats/nats.conf"]
  volumes: ["./infrastructure/nats/leaf.conf:/etc/nats/nats.conf:ro"]
  restart: unless-stopped

x-link: &link
  image: alpine/socat:latest
  command: ["-d", "tcp-listen:7422,fork,reuseaddr", "tcp-connect:nats-hub:7422"]
  # unless-stopped: a link cut by scripts/chaos (docker stop) stays cut, but a Docker restart or a sleeping laptop
  # does not leave both branches offline until someone notices
  restart: unless-stopped

x-region: &region
  image: nats:2.10.26-alpine
  command: ["-c", "/etc/nats/nats.conf"]
  profiles: [swarm, swarm-run]
  volumes: ["./infrastructure/nats/region.conf:/etc/nats/nats.conf:ro"]
  depends_on: [nats-hub]
  networks: [center]
  restart: unless-stopped

x-pg: &pg
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 20
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ центр
  nats-hub:
    image: nats:2.10.26-alpine
    container_name: esuo-nats-hub
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      LEAF_SHARED_USER: leaf
      LEAF_SHARED_PASSWORD: ${LEAF_PASSWORD:?Задайте LEAF_PASSWORD в .env}
      LEAF_B01_PASSWORD: ${LEAF_PASSWORD}
      LEAF_B02_PASSWORD: ${LEAF_PASSWORD}
      LEAF_ADVERTISE: center-link:7422
    volumes: ["./infrastructure/nats/hub.conf:/etc/nats/nats.conf:ro", "hub-data:/data"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222", "127.0.0.1:7422:7422"]
    networks: [center, wan]
    restart: unless-stopped



  postgres-center:
    <<: *pg
    container_name: esuo-postgres-center
    environment:
      POSTGRES_DB: esuo_center
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["center-db:/var/lib/postgresql/data"]
    networks: [center]

  center-app:
    build:
      context: .
      dockerfile: java-backend/Dockerfile
      args: {MODULE: center-app}
    container_name: esuo-center-app
    environment:
      DB_URL: jdbc:postgresql://postgres-center:5432/esuo_center
      DB_USER: ${DB_USER:-esuo}
      DB_PASSWORD: ${DB_PASSWORD}
      NATS_URL: nats://nats-hub:4222
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NOTIFY_URL: http://notify-mock:8090/notify
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?Задайте MP_WEBHOOK_SECRET в .env}
      MP_CALLBACK_URL: http://mp-simulator:8091/callback
      CENTER_PUBLIC_URL: ${CENTER_PUBLIC_URL:-http://localhost:8081}
      # Оператор сети: вход в /network и закрытый API центра; пусто => закрытый API недоступен никому
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      # Логи отделений → Loki (профиль monitoring). Без Loki строки ждут в CENTER_LOG, центр работает как обычно.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      # Роль grafana_ro (только чтение метрик и аномалий) для панелей Grafana; пусто => роли нет
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-ro-local}
      # Демо-стенд: окна правил мониторинга ×0,1 (перезапуск, CPU и т. п. видны за минуту, а не за полчаса)
      DEMO_MODE: ${DEMO_MODE:-false}
    ports: ["127.0.0.1:${CENTER_PORT:-8081}:8080"]
    depends_on:
      postgres-center: {condition: service_healthy}
      nats-hub: {condition: service_started}
    networks: [center]
    restart: unless-stopped

  # Демо-провайдер уведомлений: POST /chaos {"mode":"error"} — проверка №8 (scripts/chaos/notify-down.sh)
  notify-mock:
    build: tools/notify-mock
    container_name: esuo-notify-mock
    ports: ["127.0.0.1:${NOTIFY_MOCK_PORT:-8095}:8090"]
    networks: [center]
    restart: unless-stopped

  # Симулятор МП: POST /send — подписанный вебхук в центр, /callbacks — принятые callback'и
  mp-simulator:
    build: tools/mp-simulator
    container_name: esuo-mp-simulator
    environment:
      CENTER_URL: http://center-app:8080
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
    ports: ["127.0.0.1:${MP_SIMULATOR_PORT:-8096}:8091"]
    networks: [center]
    restart: unless-stopped

  # Пульт демо-сценариев (вкладка «Сценарии» в /demo): запускает scripts/demo/run.sh и отдаёт вывод построчно.
  # Только для демо-стенда: docker compose --profile demo up -d. У контейнера сокет Docker (обрыв связи, заливка
  # данных), поэтому порт наружу не публикуется — браузер ходит через ноду под входом руководителя.
  demo-runner:
    build: tools/demo-runner
    container_name: esuo-demo-runner
    profiles: [demo]
    environment:
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
      NODE: http://node-b01:8080
      NODE2: http://node-b02:8080
      CENTER: http://center-app:8080
      MP: http://mp-simulator:8091
      NOTIFY: http://notify-mock:8090
      HUB_MONITOR: http://nats-hub:8222
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}       # сценарии ходят в закрытый API центра
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      TZ: ${BRANCH_TIMEZONE:-Europe/Moscow}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [center, b01, b02]
    restart: unless-stopped

  # ------------------------------------------------------------------ рой отделений (план финала, C1)
  # Четыре региональных leaf: docker compose --profile swarm up -d. Сам рой — java -jar с хоста (порты 4231–4234)
  # или контейнером: docker compose --profile swarm run --rm swarm-sim --branches 40000 --duration 10m
  nats-region-1:
    <<: *region
    container_name: esuo-nats-region-1
    environment:
      LEAF_SERVER_NAME: region-1
      JS_DOMAIN: region-1
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@nats-hub:7422
    ports: [ "127.0.0.1:4231:4222" ]

  nats-region-2:
    <<: *region
    container_name: esuo-nats-region-2
    environment:
      LEAF_SERVER_NAME: region-2
      JS_DOMAIN: region-2
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@nats-hub:7422
    ports: [ "127.0.0.1:4232:4222" ]

  nats-region-3:
    <<: *region
    container_name: esuo-nats-region-3
    environment:
      LEAF_SERVER_NAME: region-3
      JS_DOMAIN: region-3
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@nats-hub:7422
    ports: [ "127.0.0.1:4233:4222" ]

  nats-region-4:
    <<: *region
    container_name: esuo-nats-region-4
    environment:
      LEAF_SERVER_NAME: region-4
      JS_DOMAIN: region-4
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@nats-hub:7422
    ports: [ "127.0.0.1:4234:4222" ]

  swarm-sim:
    build:
      context: .
      dockerfile: java-backend/Dockerfile
      args: {MODULE: swarm-sim}
    container_name: esuo-swarm-sim
    profiles: [swarm-run]
    command: ["--nats", "nats://nats-region-1:4222,nats://nats-region-2:4222,nats://nats-region-3:4222,nats://nats-region-4:4222",
              "--report", "/reports"]
    volumes: ["./docs/demo/load:/reports"]
    depends_on: [nats-region-1, nats-region-2, nats-region-3, nats-region-4]
    networks: [center]
  # ------------------------------------------------------------------ мониторинг (docker compose --profile monitoring up -d)
  # Loki и Grafana в центре; на каждом отделении — сборщик логов vector-bXX. Без профиля стенд прежний.
  loki:
    image: grafana/loki:3.7.8
    container_name: esuo-loki
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./infrastructure/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    networks: [center]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: esuo-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}      # на публичном сервере — false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"                           # Explore для просмотра: туда ведут ссылки на выгрузки
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-ro-local}   # источник «Центр (метрики)», роль grafana_ro
    volumes: ["./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [loki]
    networks: [center]
    restart: unless-stopped

  # ------------------------------------------------------------------ отделение b01
  nats-leaf-b01:
    <<: *leaf
    container_name: esuo-nats-leaf-b01
    environment:
      LEAF_SERVER_NAME: leaf-b01
      JS_DOMAIN: branch-b01
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: [ "./infrastructure/nats/leaf.conf:/etc/nats/nats.conf:ro", "leaf-b01-data:/data" ]
    ports: [ "127.0.0.1:8223:8222" ]
    depends_on: [ link-b01 ]
    networks: [ b01 ]

  link-b01:
    <<: *link
    container_name: esuo-link-b01
    networks:
      b01: { aliases: [ center-link ] }
      wan: { }

  postgres-b01:
    <<: *pg
    container_name: esuo-postgres-b01
    environment:
      POSTGRES_DB: esuo
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["b01-db:/var/lib/postgresql/data"]
    networks: [b01]

  node-b01:
    <<: *node-app
    container_name: esuo-node-b01
    environment: &node-env
      DB_URL: jdbc:postgresql://postgres-b01:5432/esuo
      DB_USER: ${DB_USER:-esuo}
      DB_PASSWORD: ${DB_PASSWORD}
      BRANCH_ID: b01
      BRANCH_NAME: Отделение 101000 (b01)
      NATS_URL: nats://nats-leaf-b01:4222
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
      JWT_SECRET: ${JWT_SECRET}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # QR в зале: auto — на центр, пока leaf связан с хабом, иначе на узел (адрес, с которого открыто табло)
      QR_MODE: ${QR_MODE:-auto}
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-${CENTER_PUBLIC_URL:-http://localhost:8081}}
      QR_LOCAL_BASE_URL: ${QR_LOCAL_BASE_URL:-}
      QR_SECRET: ${QR_SECRET:-}
      # Пульт сценариев на /demo: работает при DEMO_MODE=true и запущенном demo-runner (профиль demo)
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
      LOG_FILE: /app/logs/node.log           # ECS JSON с ротацией: читают сборщик логов и diag.logs
    ports: ["127.0.0.1:${NODE_PORT:-8080}:8080"]
    volumes: ["b01-logs:/app/logs"]
    depends_on:
      postgres-b01: {condition: service_healthy}
      nats-leaf-b01: {condition: service_started}
    networks: [b01]

  vector-b01:
    build: infrastructure/vector
    container_name: esuo-vector-b01
    profiles: [monitoring]
    environment: {BRANCH_ID: b01, NATS_URL: "nats://nats-leaf-b01:4222"}
    volumes: ["b01-logs:/logs:ro", "vector-b01-data:/var/lib/vector"]
    mem_limit: 64m
    depends_on: [node-b01, nats-leaf-b01]          # том логов создаёт нода (владелец app), сборщик только читает
    networks: [b01]
    restart: unless-stopped

  # ------------------------------------------------------------------ отделение b02
  nats-leaf-b02:
    <<: *leaf
    container_name: esuo-nats-leaf-b02
    environment:
      LEAF_SERVER_NAME: leaf-b02
      JS_DOMAIN: branch-b02
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: [ "./infrastructure/nats/leaf.conf:/etc/nats/nats.conf:ro", "leaf-b02-data:/data" ]
    ports: [ "127.0.0.1:8224:8222" ]
    depends_on: [ link-b02 ]
    networks: [ b02 ]

  link-b02:
    <<: *link
    container_name: esuo-link-b02
    networks:
      b02: { aliases: [ center-link ] }
      wan: { }

  postgres-b02:
    <<: *pg
    container_name: esuo-postgres-b02
    environment:
      POSTGRES_DB: esuo
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["b02-db:/var/lib/postgresql/data"]
    networks: [b02]

  node-b02:
    <<: *node-app
    container_name: esuo-node-b02
    environment:
      <<: *node-env
      DB_URL: jdbc:postgresql://postgres-b02:5432/esuo
      BRANCH_ID: b02
      BRANCH_NAME: Отделение 102000 (b02)
      NATS_URL: nats://nats-leaf-b02:4222
    ports: ["127.0.0.1:8090:8080"]
    volumes: ["b02-logs:/app/logs"]
    depends_on:
      postgres-b02: {condition: service_healthy}
      nats-leaf-b02: {condition: service_started}
    networks: [b02]

  vector-b02:
    build: infrastructure/vector
    container_name: esuo-vector-b02
    profiles: [monitoring]
    environment: {BRANCH_ID: b02, NATS_URL: "nats://nats-leaf-b02:4222"}
    volumes: ["b02-logs:/logs:ro", "vector-b02-data:/var/lib/vector"]
    mem_limit: 64m
    depends_on: [node-b02, nats-leaf-b02]
    networks: [b02]
    restart: unless-stopped

networks:
  center:
  wan:
  b01:
  b02:

volumes:
  hub-data:
  center-db:
  leaf-b01-data:
  b01-db:
  leaf-b02-data:
  b02-db:
  b01-logs:
  b02-logs:
  vector-b01-data:
  vector-b02-data:
  loki-data:
  grafana-data:
