# NATS hub центра (doc, section 10.8). JetStream-домен center.
# окружение из deploy/*/docker-compose.yml.
server_name: center-hub
port: 4222
http_port: 8222

jetstream {
  domain: center
  store_dir: /data/jetstream
}

# Сюда подключаются leaf-узлы отделений. Соединение всегда инициирует отделение (исходящий TCP),
# отделения за NAT подключаются к центру в LAN и к центру на VPS одинаково, так что по идее перерабатывать не придется
leafnodes {
  port: 7422
  advertise: $LEAF_ADVERTISE
  authorization {
    users: [
      # Общий логин стенда.
      { user: $LEAF_SHARED_USER, password: $LEAF_SHARED_PASSWORD }
      # Индивидуальные логины отделений
      { user: "branch-b01", password: $LEAF_B01_PASSWORD }
      { user: "branch-b02", password: $LEAF_B02_PASSWORD }
    ]
  }
}
