# NATS hub центра (раздел 10.8). JetStream-домен center.
# Все значения $VAR приходят из окружения контейнера (см. deploy/*/docker-compose.yml).
server_name: center-hub
port: 4222
http_port: 8222

jetstream {
  domain: center
  store_dir: /data/jetstream
}

# Сюда подключаются leaf-узлы отделений. Соединение всегда инициирует отделение (исходящий TCP),
# поэтому отделения за NAT подключаются к центру в LAN и к центру на VPS одинаково.
leafnodes {
  port: 7422
  authorization {
    users: [
      # Общий логин стенда: новое отделение подключается без правки центра.
      { user: $LEAF_SHARED_USER, password: $LEAF_SHARED_PASSWORD }
      # Индивидуальные логины отделений (техническая возможность; на стенде пароли совпадают с общим).
      { user: "branch-b01", password: $LEAF_B01_PASSWORD }
      { user: "branch-b02", password: $LEAF_B02_PASSWORD }
    ]
  }
}
