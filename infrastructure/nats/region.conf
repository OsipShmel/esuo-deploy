# Региональный leaf для роя отделений (план финала, C1; ДД §3.8). Один файл на все регионы; различия — в env:
#   LEAF_SERVER_NAME  region-1
#   JS_DOMAIN         region-1
#   LEAF_REMOTE_URL   nats-leaf://<user>:<password>@<hub>:7422
# Виртуальные отделения региона публикуют события сюда, стрим REGION_EVT (branch.*.evt.>) создаёт swarm-sim,
# центр подключает его источником один раз на регион по полю events_via в heartbeat.
server_name: $LEAF_SERVER_NAME
port: 4222
http_port: 8222
max_payload: 1MB

jetstream {
  domain: $JS_DOMAIN
  store_dir: /data/jetstream
}

leafnodes {
  remotes: [
    {
      url: $LEAF_REMOTE_URL
      # События чужих регионов и настоящих отделений сюда не нужны: иначе REGION_EVT с subjects branch.*.evt.>
      # собрал бы через хаб события всей сети. Heartbeat и конфигурация проходят как обычно.
      deny_imports: ["branch.*.evt.>"]
    }
  ]
}
