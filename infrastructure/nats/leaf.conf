# NATS leaf отделения (раздел 10.8). Один файл на все отделения; различия — только в env:
#   LEAF_SERVER_NAME  leaf-b01
#   JS_DOMAIN         branch-b01   — свой домен обязателен, иначе JetStream отделения сольётся с центром
#   LEAF_REMOTE_URL   nats-leaf://<user>:<password>@<center-host>:7422
server_name: $LEAF_SERVER_NAME
port: 4222
http_port: 8222

jetstream {
  domain: $JS_DOMAIN
  store_dir: /data/jetstream
}

leafnodes {
  # Переподключение к hub бесконечное, по умолчанию раз в секунду: восстановление связи автоматическое.
  remotes: [
    { url: $LEAF_REMOTE_URL }
  ]
}
