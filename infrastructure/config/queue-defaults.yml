# Default queue coefficients (doc section 6.9).
# config-version is incremented whenever the file is modified.
queue:
  config-version: 5
  target-wait-min:              # due_at = issued_at + value (стоит пересмотреть)
    qr: {default: 20, pensioner: 15}
    walkin: {default: 30, pensioner: 20}
  early-checkin-min: 15         # how early before the slot a booking becomes eligible
  grace-late-min: 10            # lateness without losing priority (тоже стоит пересмотреть, как и всю механику очереди)
  late-policy: convert_to_qr    # convert_to_qr | reject
  late-checkin-retention-min: 60  # after slot_start + this a missing booking → no_show (реализации ручного присвоения статуса еще нет)
  slot-duration-min: 15
  slot-capacity: 1
  booking-horizon-days: 30
  opening-time: "09:00"
  closing-time: "18:00"
  slack-min: 5                  # window where score applies
  call-timeout-sec: 90          # recall after
  max-recalls: 2                # recalls before no_show
  auto-call-on-free: false
  scoring-strategy: uniform     # uniform | heuristic
  requeue-default-mode: keep_position   # keep_position | to_tail
  postpone-max-count: 1
  postpone-max-min: 30
  default-service-duration-sec: 300     # service estimate fallback
  approaching-position-lte: 3           # "approaching" notification
  approaching-eta-lte-min: 5
  idle-alert-min: 15                    # open window idle longer → deviation S14
  long-service-min: 20                  # longer service → "long service" deviation
  heuristic-min-samples: 5              # heuristic: min samples to trust a cascade level (16.2)
  recommend-overdue-min: 10             # open-window recommendation: ETA past deadline by more than N min (6.8)
  recommend-overdue-count: 5            # ...or more than N overdue tickets of the service
  slow-window-factor: 1.5               # slow window deviation (16.3): window average > N × norm for the same services
