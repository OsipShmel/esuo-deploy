# Default queue coefficients (doc section 6.9).
# config-version is incremented whenever the file is modified.
queue:
  config-version: 2
  target-wait-min:              # due_at = момент выдачи + значение(стоит пересмотреть)
    qr: {default: 20, pensioner: 15, svo: 5}
    walkin: {default: 30, pensioner: 20, svo: 5}
  early-checkin-min: 15         # с какого момента до слота запись допускается к вызову
  grace-late-min: 10            # опоздание без потери приоритета(тоже стоит пересмотреть, как и всю механику очереди)
  late-policy: convert_to_qr    # convert_to_qr | reject
  late-checkin-retention-min: 60  # после slot_start + это значение неявившаяся запись → no_show(реализации ручного присвоения статуса еще нет)
  slot-duration-min: 15
  slot-capacity: 1
  booking-horizon-days: 30
  opening-time: "09:00"
  closing-time: "18:00"
  slack-min: 5                  # окно, внутри которого действует score
  call-timeout-sec: 90          # повторный вызов
  max-recalls: 2                # повторных вызовов до no_show
  auto-call-on-free: false
  scoring-strategy: uniform     # uniform | heuristic
  requeue-default-mode: keep_position   # keep_position | to_tail
  postpone-max-count: 1
  postpone-max-min: 30
  default-service-duration-sec: 300     # прогноз обслуживания, затычка
  approaching-position-lte: 3           # "очередь приближается"
  approaching-eta-lte-min: 5