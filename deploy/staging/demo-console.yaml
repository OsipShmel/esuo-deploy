# Scenario console on staging: the "Scenarios" tab on a branch's /demo runs scripts/demo/run.sh.
#   docker compose -f deploy/staging/demo-console.yaml --env-file .env up -d --build
# The container holds the Docker socket (link cuts, data loading), so no port is published: the browser reaches it
# only through a node, signed in as branch admin, and the node presents a shared token. Peers are addressed by
# container name on esuo-wan.
name: esuo-demo

services:
  demo-runner:
    build: ../../tools/demo-runner
    container_name: esuo-demo-runner
    environment:
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
      NODE: http://esuo-node-b01:8080
      NODE2: http://esuo-node-b02:8080
      CENTER: http://esuo-center-app:8080
      CENTER_MGMT: http://esuo-center-app:9081
      MP: http://esuo-mp-simulator:8091
      NOTIFY: http://esuo-notify-mock:8090
      HUB_MONITOR: http://esuo-nats-hub:8222
      LOKI: http://esuo-loki:3100
      GRAFANA: http://esuo-grafana:3000
      PROMETHEUS: http://esuo-prometheus:9090
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      TZ: ${BRANCH_TIMEZONE:-Europe/Moscow}
    volumes:
      - ../..:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [wan]
    restart: unless-stopped

networks:
  wan: {name: esuo-wan, external: true}
