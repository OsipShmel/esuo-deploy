# Staging overlay for the load test (regions and swarm-sim are defined in deploy/loadtest/compose.yaml):
#   docker compose -f deploy/loadtest/compose.yaml -f deploy/staging/loadtest.override.yaml --env-file .env up -d
#   docker compose -f deploy/loadtest/compose.yaml -f deploy/staging/loadtest.override.yaml --env-file .env \
#     --profile run run --rm swarm-sim --branches 40000 --duration 10m
# Regional hubs reach the center's hub over esuo-wan (HUB_HOST defaults to nats-hub).
services:
  nats-region-1:
    container_name: esuo-nats-region-1
    networks: [default, wan]

  nats-region-2:
    container_name: esuo-nats-region-2
    networks: [default, wan]

  nats-region-3:
    container_name: esuo-nats-region-3
    networks: [default, wan]

  nats-region-4:
    container_name: esuo-nats-region-4
    networks: [default, wan]

networks:
  wan: {name: esuo-wan, external: true}
