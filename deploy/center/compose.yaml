# ESUO network center: PostgreSQL, the NATS hub that branches and regional leaf nodes connect to, and center-app.
# Observability (Loki, Grafana, Prometheus, exporters, the center's log shipper) is the `monitoring` profile.
#
#   cp deploy/center/.env.example deploy/center/.env
#   docker compose -f deploy/center/compose.yaml --env-file deploy/center/.env --profile monitoring up -d
#
# Published ports: 7422/tcp (leaf connections, LEAF_BIND) and the HTTP API (CENTER_BIND, loopback by default — put a
# TLS-terminating reverse proxy in front of it). Everything else listens on the host's loopback interface only.
#
# Images: ${IMAGE_REGISTRY}/center-app:${IMAGE_TAG}. `docker compose pull` takes them from the registry; `up --build`
# builds them from this checkout instead.
name: esuo-center

x-logging: &logging
  driver: json-file
  options: {max-size: 50m, max-file: "5"}

services:
  postgres-center:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esuo_center
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    # Sized for a network of hundreds of thousands of branches: with the defaults (128 MB of buffers, a checkpoint
    # every 1 GB of WAL, a throttled autovacuum) every heartbeat flush waits for disk reads.
    command: >-
      postgres -c shared_buffers=${CENTER_DB_SHARED_BUFFERS:-1GB} -c effective_cache_size=3GB
      -c max_wal_size=4GB -c checkpoint_timeout=15min -c wal_compression=lz4
      -c autovacuum_vacuum_cost_limit=2000
    shm_size: 256mb
    volumes: ["center-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esuo_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  nats-hub:
    image: nats:2.15.0-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      LEAF_SHARED_USER: ${LEAF_USER:-leaf}
      LEAF_SHARED_PASSWORD: ${LEAF_PASSWORD:?Set LEAF_PASSWORD}
      LEAF_B01_PASSWORD: ${LEAF_B01_PASSWORD:-${LEAF_PASSWORD}}
      LEAF_B02_PASSWORD: ${LEAF_B02_PASSWORD:-${LEAF_PASSWORD}}
      LEAF_ADVERTISE: ${LEAF_ADVERTISE:-localhost:7422}      # host:port branches use to reach this hub
      # A hub that outgrows its memory is killed alone instead of taking the center down with it.
      GOMEMLIMIT: ${HUB_GOMEMLIMIT:-1536MiB}
    mem_limit: ${HUB_MEMORY:-2g}
    volumes: ["../../infrastructure/nats/hub.conf:/etc/nats/nats.conf:ro", "hub-data:/data"]
    ports:
      - "${LEAF_BIND:-0.0.0.0}:7422:7422"     # leaf connections: branches and regional hubs
      - "127.0.0.1:4222:4222"                 # client port, for the nats CLI on the host
      - "127.0.0.1:8222:8222"                 # monitoring endpoint: /leafz, /jsz
    logging: *logging
    restart: unless-stopped

  center-app:
    image: ${IMAGE_REGISTRY:-esuo}/center-app:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: center-app}
    environment:
      DB_URL: jdbc:postgresql://postgres-center:5432/esuo_center
      DB_USER: ${DB_USER:-esuo}
      DB_PASSWORD: ${DB_PASSWORD}
      NATS_URL: nats://nats-hub:4222
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CENTER_PUBLIC_URL: ${CENTER_PUBLIC_URL:?Set CENTER_PUBLIC_URL}
      # External integrations: the notification provider and the mobile app's callback endpoint
      NOTIFY_URL: ${NOTIFY_URL:?Set NOTIFY_URL}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?Set MP_WEBHOOK_SECRET}
      MP_CALLBACK_URL: ${MP_CALLBACK_URL:?Set MP_CALLBACK_URL}
      # Network operator account for /network and the private API; an empty password disables the private API
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      # Branch logs go to Loki (monitoring profile). Without Loki they wait in the CENTER_LOG stream for up to 7 days.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      # Read-only database role for Grafana panels (grafana_ro); empty => the role is not created
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Branch metrics history: one point per 10 s for directly connected branches, per 60 s behind a regional hub;
      # whole hours are dropped after METRICS_RETENTION, or earlier once the table outgrows METRICS_MAX_SIZE
      METRICS_RESOLUTION: ${METRICS_RESOLUTION:-10s}
      METRICS_RESOLUTION_REGIONAL: ${METRICS_RESOLUTION_REGIONAL:-60s}
      METRICS_RETENTION: ${METRICS_RETENTION:-48h}
      METRICS_MAX_SIZE: ${METRICS_MAX_SIZE:-100GB}
      # The heap is bounded and the JVM exits on OOM so Docker restarts it; the first heap dump stays in center-dumps.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${CENTER_HEAP:-4g} -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps
      LOG_FILE: /app/logs/center.log           # ECS JSON with rotation; vector-center ships it to Loki
    volumes: ["center-dumps:/app/dumps", "center-logs:/app/logs"]
    # 9081 is the management port (health, /actuator/prometheus): loopback only
    ports: ["${CENTER_BIND:-127.0.0.1}:${CENTER_PORT:-8081}:8080", "127.0.0.1:${CENTER_MANAGEMENT_PORT:-9081}:9081"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/livez"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4
    depends_on:
      postgres-center: {condition: service_healthy}
      nats-hub: {condition: service_started}
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ observability (--profile monitoring)
  # Branch and center logs go to Loki, the center's own metrics to Prometheus, Grafana shows both. Branch metrics are
  # stored in the center database (branch_metrics); each branch ships its own logs (deploy/branch).
  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["../../infrastructure/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}          # empty => Grafana default, set it outside a laptop
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"                           # Explore for viewers: links to pulled logs open there
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}               # datasource for branch metrics, role grafana_ro
    volumes: ["../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    mem_limit: 512m
    depends_on: [loki, prometheus]
    logging: *logging
    restart: unless-stopped

  vector-center:                                 # the center's own log file -> Loki (service=center)
    image: timberio/vector:0.58.0-alpine
    profiles: [monitoring]
    volumes: ["../../infrastructure/vector/center.yaml:/etc/vector/vector.yaml:ro", "center-logs:/logs:ro",
              "vector-center-data:/var/lib/vector"]
    mem_limit: 128m
    depends_on: [center-app, loki]
    logging: *logging
    restart: unless-stopped

  prometheus:                                    # metrics of the center itself: JVM, its jobs, the hub, its database
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}",
              "--storage.tsdb.retention.size=${PROMETHEUS_MAX_SIZE:-10GB}"]
    volumes: ["../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"]
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  nats-exporter:                                 # hub: leaf connections, slow consumers, JetStream
    image: natsio/prometheus-nats-exporter:0.17.3
    profiles: [monitoring]
    command: ["-varz", "-connz", "-subz", "-leafz", "-jsz=all", "-healthz", "http://nats-hub:8222"]
    mem_limit: 128m
    depends_on: [nats-hub]
    logging: *logging
    restart: unless-stopped

  postgres-exporter:                             # center database: connections, locks, sizes, long queries
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres-center:5432/esuo_center?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-esuo}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    mem_limit: 128m
    depends_on: [postgres-center]
    logging: *logging
    restart: unless-stopped

volumes:
  center-db:
  center-dumps:
  center-logs:
  vector-center-data:
  hub-data:
  loki-data:
  grafana-data:
  prometheus-data:
