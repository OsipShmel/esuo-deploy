# Центр: база центра, хаб NATS, центр, симуляторы МП и уведомлений; мониторинг центра — профиль monitoring.
# Сам по себе — сервер центра (стенд из нескольких машин):
#   cp deploy/center/.env.example deploy/center/.env      # пароли, адрес центра для отделений
#   docker compose -f deploy/center/docker-compose.yml --env-file deploy/center/.env [--profile monitoring] up -d --build
# Наружу открыты 7422 (leaf-подключения отделений и регионов) и 8081 (API центра); остальное — localhost сервера.
# Корневой docker-compose.yml («всё в одном») берёт отсюда сервисы через extends: правка центра — только здесь.
name: esuo-center

services:
  postgres-center:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esuo_center
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD}
    # Under a network of hundreds of thousands of branches (scale design 9.3): the defaults — 128 MB of buffers, a
    # checkpoint every 1 GB of WAL, a throttled autovacuum — made every heartbeat flush wait for disk reads.
    command: >-
      postgres -c shared_buffers=${CENTER_DB_SHARED_BUFFERS:-1GB} -c effective_cache_size=3GB
      -c max_wal_size=4GB -c checkpoint_timeout=15min -c wal_compression=lz4
      -c autovacuum_vacuum_cost_limit=2000
    shm_size: 256mb
    ports: ["127.0.0.1:${CENTER_DB_PORT:-5435}:5432"]
    volumes: ["center-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esuo_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats-hub:
    image: nats:2.10.26-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      LEAF_SHARED_USER: ${LEAF_USER:-leaf}
      LEAF_SHARED_PASSWORD: ${LEAF_PASSWORD:?Задайте LEAF_PASSWORD}
      LEAF_B01_PASSWORD: ${LEAF_B01_PASSWORD:-${LEAF_PASSWORD}}
      LEAF_B02_PASSWORD: ${LEAF_B02_PASSWORD:-${LEAF_PASSWORD}}
      LEAF_ADVERTISE: ${LEAF_ADVERTISE:-localhost:7422}      # на сервере — адрес центра для отделений: <host>:7422
      # A hub that outgrows its memory is killed alone: on a shared host it once took the center down with it.
      GOMEMLIMIT: ${HUB_GOMEMLIMIT:-1536MiB}
    mem_limit: ${HUB_MEMORY:-2g}
    volumes: ["../../infrastructure/nats/hub.conf:/etc/nats/nats.conf:ro", "hub-data:/data"]
    ports:
      - "${LEAF_BIND:-0.0.0.0}:7422:7422"     # отделения и регионы
      - "127.0.0.1:4222:4222"                 # отладка (nats CLI)
      - "127.0.0.1:8222:8222"                 # мониторинг: /leafz, /jsz
    restart: unless-stopped

  center-app:
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: center-app}
    environment:
      DB_URL: jdbc:postgresql://postgres-center:5432/esuo_center
      DB_USER: ${DB_USER:-esuo}
      DB_PASSWORD: ${DB_PASSWORD}
      NATS_URL: nats://nats-hub:4222
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NOTIFY_URL: ${NOTIFY_URL:-http://notify-mock:8090/notify}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?Задайте MP_WEBHOOK_SECRET}
      MP_CALLBACK_URL: ${MP_CALLBACK_URL:-http://mp-simulator:8091/callback}
      CENTER_PUBLIC_URL: ${CENTER_PUBLIC_URL:-http://localhost:8081}   # на сервере — http(s)://<адрес центра>:8081
      # Оператор сети: вход в /network и закрытый API центра; пусто => закрытый API недоступен никому
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      # Логи отделений → Loki (профиль monitoring). Без Loki строки ждут в CENTER_LOG, центр работает как обычно.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      # Роль grafana_ro (только чтение метрик и аномалий) для панелей Grafana; пусто => роли нет
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-ro-local}
      # Демо-стенд: окна правил мониторинга ×0,1 (перезапуск, CPU и т. п. видны за минуту, а не за полчаса)
      DEMO_MODE: ${DEMO_MODE:-false}
      # История метрик отделений: точка раз в 10 с у обычных отделений, раз в 60 с у отделений за региональным хабом
      # (рой); старые часы удаляются целиком через 48 ч или раньше, если таблица больше METRICS_MAX_SIZE
      METRICS_RESOLUTION: ${METRICS_RESOLUTION:-10s}
      METRICS_RESOLUTION_REGIONAL: ${METRICS_RESOLUTION_REGIONAL:-60s}
      METRICS_RETENTION: ${METRICS_RETENTION:-48h}
      METRICS_MAX_SIZE: ${METRICS_MAX_SIZE:-100GB}
      # Куча центра (на сервере с роем — 4g); при нехватке памяти JVM завершается (Docker поднимает заново), а не висит
      # «живой» без работы. Первый дамп кучи остаётся в томе center-dumps (следующие не пишутся, пока его не удалить).
      JAVA_TOOL_OPTIONS: >-
        -Xmx${CENTER_HEAP:-2g} -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps
      LOG_FILE: /app/logs/center.log           # ECS JSON с ротацией: vector-center везёт его в Loki (service=center)
    volumes: ["center-dumps:/app/dumps", "center-logs:/app/logs"]
    # 9081 — actuator центра (health, /actuator/prometheus): только localhost, его читают Prometheus и doctor
    ports: ["${CENTER_BIND:-0.0.0.0}:${CENTER_PORT:-8081}:8080", "127.0.0.1:${CENTER_MANAGEMENT_PORT:-9081}:9081"]
    depends_on:
      postgres-center: {condition: service_healthy}
      nats-hub: {condition: service_started}
    restart: unless-stopped

  # Демо-провайдер уведомлений: POST /chaos {"mode":"error"} — проверка №8 (scripts/chaos/notify-down.sh)
  notify-mock:
    build: ../../tools/notify-mock
    ports: ["127.0.0.1:${NOTIFY_MOCK_PORT:-8095}:8090"]
    restart: unless-stopped

  # Симулятор МП: POST /send — подписанный вебхук в центр, /callbacks — принятые callback'и
  mp-simulator:
    build: ../../tools/mp-simulator
    environment:
      CENTER_URL: http://center-app:8080
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
    ports: ["127.0.0.1:${MP_SIMULATOR_PORT:-8096}:8091"]
    restart: unless-stopped

  # ------------------------------------------------------------------ мониторинг центра (--profile monitoring)
  # Логи отделений и самого центра — Loki, метрики самого центра — Prometheus, всё вместе — Grafana. Метрики отделений
  # живут в базе центра (branch_metrics), сборщик логов отделения — в deploy/branch.
  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["../../infrastructure/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}      # на публичном сервере — false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"                           # Explore для просмотра: туда ведут ссылки на выгрузки
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-ro-local}   # источник «Центр (метрики)», роль grafana_ro
    volumes: ["../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    mem_limit: 512m
    depends_on: [loki, prometheus]
    restart: unless-stopped

  vector-center:                                 # логи самого центра → Loki (service=center); без NATS: Loki рядом
    image: timberio/vector:0.58.0-alpine
    profiles: [monitoring]
    volumes: ["../../infrastructure/vector/center.yaml:/etc/vector/vector.yaml:ro", "center-logs:/logs:ro",
              "vector-center-data:/var/lib/vector"]
    mem_limit: 128m
    depends_on: [center-app, loki]
    restart: unless-stopped

  # Метрики самого центра (JVM, его задачи, хаб NATS, БД центра)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}",
              "--storage.tsdb.retention.size=${PROMETHEUS_MAX_SIZE:-10GB}"]
    volumes: ["../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    mem_limit: 1g
    restart: unless-stopped

  nats-exporter:                                 # хаб: соединения leaf (отделения и регионы), медленные потребители, JetStream
    image: natsio/prometheus-nats-exporter:0.17.3
    profiles: [monitoring]
    command: ["-varz", "-connz", "-subz", "-leafz", "-jsz=all", "-healthz", "http://nats-hub:8222"]
    mem_limit: 128m
    depends_on: [nats-hub]
    restart: unless-stopped

  postgres-exporter:                             # БД центра: соединения, блокировки, размеры, долгие запросы
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres-center:5432/esuo_center?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-esuo}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    mem_limit: 128m
    depends_on: [postgres-center]
    restart: unless-stopped

volumes:
  center-db:
  center-dumps:
  center-logs:
  vector-center-data:
  hub-data:
  loki-data:
  grafana-data:
  prometheus-data:
