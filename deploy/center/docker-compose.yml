# Центр для стенда из нескольких машин. Запуск на ПК центра (или VPS):
#   cp deploy/center/.env.example deploy/center/.env
#   docker compose -f deploy/center/docker-compose.yml --env-file deploy/center/.env up -d --build
# Наружу открыты: 7422 (leaf-подключения отделений) и 8081 (публичный API центра).
name: esuo-center
services:
  postgres-center:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esuo_center
      POSTGRES_USER: ${CENTER_DB_USER:-esuo}
      POSTGRES_PASSWORD: ${CENTER_DB_PASSWORD:?Задайте CENTER_DB_PASSWORD}
    ports: ["127.0.0.1:${CENTER_DB_PORT:-5435}:5432"]
    volumes: ["center-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esuo_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats-hub:
    image: nats:2.10.26-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      LEAF_SHARED_USER: ${LEAF_SHARED_USER:-leaf}
      LEAF_SHARED_PASSWORD: ${LEAF_SHARED_PASSWORD:?Задайте LEAF_SHARED_PASSWORD}
      LEAF_B01_PASSWORD: ${LEAF_B01_PASSWORD:-${LEAF_SHARED_PASSWORD}}
      LEAF_B02_PASSWORD: ${LEAF_B02_PASSWORD:-${LEAF_SHARED_PASSWORD}}
      LEAF_ADVERTISE: ${LEAF_ADVERTISE:?Задайте LEAF_ADVERTISE=<адрес центра для отделений>:7422}
    volumes: ["../../infrastructure/nats/hub.conf:/etc/nats/nats.conf:ro", "hub-data:/data"]
    ports:
      - "${LEAF_BIND:-0.0.0.0}:7422:7422"     # отделения
      - "127.0.0.1:4222:4222"                 # отладка (nats CLI)
      - "127.0.0.1:8222:8222"                 # мониторинг: /leafz, /jsz
    restart: unless-stopped

  center-app:
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: center-app}
    environment:
      DB_URL: jdbc:postgresql://postgres-center:5432/esuo_center
      DB_USER: ${CENTER_DB_USER:-esuo}
      DB_PASSWORD: ${CENTER_DB_PASSWORD}
      NATS_URL: nats://nats-hub:4222
      JWT_SECRET: ${CENTER_JWT_SECRET:?Задайте CENTER_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NOTIFY_URL: ${NOTIFY_URL:-http://notify-mock:8090/notify}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?Задайте MP_WEBHOOK_SECRET}
      MP_CALLBACK_URL: ${MP_CALLBACK_URL:-http://mp-simulator:8091/callback}
      CENTER_PUBLIC_URL: ${CENTER_PUBLIC_URL:?Задайте CENTER_PUBLIC_URL=http(s)://<адрес центра>:8081}
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}   # пусто => закрытый API центра недоступен
      LOKI_URL: ${LOKI_URL:-http://loki:3100}             # профиль monitoring; без Loki строки ждут в CENTER_LOG
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}         # ссылки на выгруженные логи; пусто => без ссылки
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}       # роль grafana_ro для панелей метрик; пусто => роли нет
      METRICS_RESOLUTION: ${METRICS_RESOLUTION:-10s}      # история метрик: обычные отделения
      METRICS_RESOLUTION_REGIONAL: ${METRICS_RESOLUTION_REGIONAL:-60s}   # отделения за региональным хабом (рой)
      METRICS_RETENTION: ${METRICS_RETENTION:-48h}
      METRICS_MAX_SIZE: ${METRICS_MAX_SIZE:-100GB}        # страховка диска: сверх неё старые часы уходят раньше
      # Куча центра (на сервере с роем — 4g); при нехватке памяти JVM завершается и Docker поднимает её заново
      JAVA_TOOL_OPTIONS: >-
        -Xmx${CENTER_HEAP:-2g} -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps
    volumes: ["center-dumps:/app/dumps"]
    # 9081 — actuator (health, /actuator/prometheus): только localhost сервера, снаружи — через Grafana
    ports: ["${CENTER_BIND:-0.0.0.0}:${CENTER_PORT:-8081}:8080", "127.0.0.1:${CENTER_MANAGEMENT_PORT:-9081}:9081"]
    depends_on:
      postgres-center: {condition: service_healthy}
      nats-hub: {condition: service_started}
    restart: unless-stopped

  notify-mock:
    build: ../../tools/notify-mock
    ports: ["127.0.0.1:${NOTIFY_MOCK_PORT:-8095}:8090"]
    restart: unless-stopped

  mp-simulator:
    build: ../../tools/mp-simulator
    environment:
      CENTER_URL: http://center-app:8080
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
    ports: ["127.0.0.1:${MP_SIMULATOR_PORT:-8096}:8091"]
    restart: unless-stopped

  # Логи отделений (docker compose --profile monitoring up -d)
  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["../../infrastructure/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}     # публичный сервер: только вход
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}       # источник «Центр (метрики)», роль grafana_ro
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: ["../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [loki, prometheus]
    restart: unless-stopped

  # Метрики самого центра (JVM, его задачи, хаб NATS, БД центра); снаружи — через Grafana, Prometheus — localhost
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}",
              "--storage.tsdb.retention.size=${PROMETHEUS_MAX_SIZE:-10GB}"]
    volumes: ["../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    profiles: [monitoring]
    command: ["-varz", "-connz", "-subz", "-leafz", "-jsz=all", "-healthz", "http://nats-hub:8222"]
    depends_on: [nats-hub]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres-center:5432/esuo_center?sslmode=disable
      DATA_SOURCE_USER: ${CENTER_DB_USER:-esuo}
      DATA_SOURCE_PASS: ${CENTER_DB_PASSWORD}
    depends_on: [postgres-center]
    restart: unless-stopped

volumes:
  center-db:
  center-dumps:
  hub-data:
  loki-data:
  grafana-data:
  prometheus-data:
