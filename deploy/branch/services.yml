# Шаблоны сервисов отделения — общее у любого отделения: образы, сборка, общие переменные, ресурсы.
# Номер отделения, адрес центра, порты, тома и зависимости задаёт тот, кто берёт шаблон через extends:
# deploy/branch/docker-compose.yml (одно отделение) или корневой docker-compose.yml (b01 и b02 «всё в одном»).
# Здесь нет depends_on: при extends они переходят к наследнику с этими же именами сервисов, а у наследника имена свои.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esuo
      POSTGRES_USER: ${DB_USER:-esuo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esuo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats-leaf:
    image: nats:2.15.0-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["../../infrastructure/nats/leaf.conf:/etc/nats/nats.conf:ro"]
    restart: unless-stopped

  node-app:
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: node-app}
    environment:
      JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError     # нехватка памяти — перезапуск, а не зомби
      DB_USER: ${DB_USER:-esuo}
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # QR в зале: auto — на центр, пока leaf связан с хабом, иначе на узел (адрес, с которого открыто табло)
      QR_MODE: ${QR_MODE:-auto}
      QR_LOCAL_BASE_URL: ${QR_LOCAL_BASE_URL:-}
      QR_SECRET: ${QR_SECRET:-}
      QR_STICKER_KEY_VERSION: ${QR_STICKER_KEY_VERSION:-1}
      LOG_FILE: /app/logs/node.log           # ECS JSON с ротацией: читают сборщик логов и diag.logs
    restart: unless-stopped

  # Сборщик важных логов узла в BRANCH_LOG (профиль monitoring): мониторинг отделения живёт с отделением
  vector:
    build: ../../infrastructure/vector
    profiles: [monitoring]
    mem_limit: 64m
    restart: unless-stopped
