# Отделение для стенда из нескольких машин. Запуск на ПК отделения:
#   cp deploy/branch/.env.example deploy/branch/.env   # задать BRANCH_ID, CENTER_HOST, пароли
#   docker compose -f deploy/branch/docker-compose.yml --env-file deploy/branch/.env [--profile monitoring] up -d --build
# Отделению нужен только исходящий TCP до CENTER_HOST:7422 (LAN или VPS — без разницы). Несколько отделений на одной
# машине — разные env-файлы (BRANCH_ID, порты): у каждого свой проект esuo-branch-<номер>.
# Сервисы — шаблоны deploy/branch/services.yml; здесь только то, что принадлежит этому отделению.
name: esuo-branch-${BRANCH_ID:?Задайте BRANCH_ID}

services:
  postgres:
    extends: {file: services.yml, service: postgres}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["branch-db:/var/lib/postgresql/data"]

  nats-leaf:
    extends: {file: services.yml, service: nats-leaf}
    environment:
      LEAF_SERVER_NAME: leaf-${BRANCH_ID}
      JS_DOMAIN: branch-${BRANCH_ID}
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD:?Задайте LEAF_PASSWORD}@${CENTER_HOST:?Задайте CENTER_HOST}:${CENTER_LEAF_PORT:-7422}
    volumes: ["leaf-data:/data"]
    ports: ["127.0.0.1:${LEAF_CLIENT_PORT:-4222}:4222", "127.0.0.1:${LEAF_MONITOR_PORT:-8223}:8222"]

  node-app:
    extends: {file: services.yml, service: node-app}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/esuo
      BRANCH_ID: ${BRANCH_ID}
      BRANCH_NAME: ${BRANCH_NAME:-Отделение ${BRANCH_ID}}
      NATS_URL: nats://nats-leaf:4222
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-}
    ports: ["${NODE_BIND:-0.0.0.0}:${NODE_PORT:-8080}:8080"]
    volumes: ["branch-logs:/app/logs"]
    depends_on:
      postgres: {condition: service_healthy}
      nats-leaf: {condition: service_started}

  vector:
    extends: {file: services.yml, service: vector}
    environment:
      BRANCH_ID: ${BRANCH_ID}
      NATS_URL: nats://nats-leaf:4222
    volumes: ["branch-logs:/logs:ro", "vector-data:/var/lib/vector"]
    depends_on: [node-app, nats-leaf]          # том логов создаёт нода (владелец app), сборщик только читает

volumes:
  branch-db:
  leaf-data:
  branch-logs:
  vector-data:
