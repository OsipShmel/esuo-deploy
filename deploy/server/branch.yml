# Отделение на сервере: поверх deploy/branch/docker-compose.yml (сервисы описаны там), номер и порты — в env-файле.
#   docker compose -f deploy/branch/docker-compose.yml -f deploy/server/branch.yml \
#     --env-file .env --env-file deploy/server/b01.env --profile monitoring up -d --build
# Здесь только серверное: «кабель» связи с хабом, как на стенде (его рвут link-cut, monitoring, health), имена
# контейнеров как у стенда (их знают scripts/demo и scripts/chaos), сеть esuo-wan для кабеля и пульта сценариев.
services:
  link:
    image: alpine/socat:latest
    container_name: esuo-link-${BRANCH_ID}
    command: ["-d", "tcp-listen:7422,fork,reuseaddr", "tcp-connect:nats-hub:7422"]
    # unless-stopped: a link cut by scripts/chaos (docker stop) stays cut, a restarted Docker brings it back
    restart: unless-stopped
    networks:
      default: {aliases: [center-link]}        # leaf отделения подключается к CENTER_HOST=center-link
      wan: {}

  postgres:
    container_name: esuo-postgres-${BRANCH_ID}

  nats-leaf:
    container_name: esuo-nats-leaf-${BRANCH_ID}
    depends_on: [link]

  node-app:
    container_name: esuo-node-${BRANCH_ID}
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${NODE_HEAP:-1g} -XX:+ExitOnOutOfMemoryError   # без -Xmx JVM взяла бы четверть ОЗУ сервера
      # Пульт сценариев на /demo (вкладка «Сценарии»): deploy/server/demo.yml
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://esuo-demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
    networks: [default, wan]                   # wan — только для пульта сценариев; NATS узел берёт у своего leaf

  vector:
    container_name: esuo-vector-${BRANCH_ID}

networks:
  wan: {name: esuo-wan, external: true}
