# Экземпляр роя (план финала, C1): четыре региональных leaf — JetStream-домены region-1…4, к которым подключаются
# виртуальные отделения, — и сам рой swarm-sim. Регионы держат связь с хабом центра (исходящий TCP на 7422).
# Сам по себе — рой на отдельной машине:
#   cp deploy/swarm/.env.example deploy/swarm/.env      # LEAF_PASSWORD центра, HUB_HOST — адрес центра
#   docker compose -f deploy/swarm/docker-compose.yml --env-file deploy/swarm/.env up -d
#   docker compose -f deploy/swarm/docker-compose.yml --env-file deploy/swarm/.env run --rm swarm-sim --branches 40000
# или рой с хоста: java -jar java-backend/swarm-sim/target/swarm-sim-0.0.1-SNAPSHOT.jar (регионы на 4231–4234).
# Потоки регионов живут в слое контейнера: перед новым замером их обнуляет up -d --force-recreate.
# Корневой docker-compose.yml берёт регионы отсюда через extends (профиль swarm).
name: esuo-swarm

x-region: &region
  image: nats:2.15.0-alpine
  command: ["-c", "/etc/nats/nats.conf"]
  volumes: ["../../infrastructure/nats/region.conf:/etc/nats/nats.conf:ro"]
  mem_limit: 1g
  restart: unless-stopped

services:
  nats-region-1:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-1
      JS_DOMAIN: region-1
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD:?Задайте LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4231:4222"]

  nats-region-2:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-2
      JS_DOMAIN: region-2
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4232:4222"]

  nats-region-3:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-3
      JS_DOMAIN: region-3
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4233:4222"]

  nats-region-4:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-4
      JS_DOMAIN: region-4
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4234:4222"]

  swarm-sim:
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: swarm-sim}
    profiles: [run]
    # Regions and the report folder in the entrypoint: `run --rm swarm-sim --branches N` adds to them, not replaces
    entrypoint: ["java", "-jar", "app.jar", "--report", "/reports",
                 "--nats", "nats://nats-region-1:4222,nats://nats-region-2:4222,nats://nats-region-3:4222,nats://nats-region-4:4222"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${SWARM_HEAP:-2g}         # 250 000 отделений — 4g
    volumes: ["../../docs/demo/load:/reports"]
    depends_on: [nats-region-1, nats-region-2, nats-region-3, nats-region-4]
