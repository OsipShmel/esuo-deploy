# Load test for the center: four regional NATS hubs (JetStream domains region-1..4) and swarm-sim, a single process
# that simulates up to hundreds of thousands of branches behind them. Regions connect out to the center's hub on 7422.
#
#   cp deploy/loadtest/.env.example deploy/loadtest/.env      # HUB_HOST, the center's LEAF_PASSWORD
#   docker compose -f deploy/loadtest/compose.yaml --env-file deploy/loadtest/.env up -d
#   docker compose -f deploy/loadtest/compose.yaml --env-file deploy/loadtest/.env --profile run \
#     run --rm swarm-sim --branches 40000 --duration 10m
#
# The region streams live in the container layer: `up -d --force-recreate` resets them before a new run.
# The root compose.yaml reuses the regions from here (profile swarm).
name: esuo-loadtest

x-region: &region
  image: nats:2.15.0-alpine
  command: ["-c", "/etc/nats/nats.conf"]
  volumes: ["../../infrastructure/nats/region.conf:/etc/nats/nats.conf:ro"]
  mem_limit: 1g
  restart: unless-stopped

services:
  nats-region-1:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-1
      JS_DOMAIN: region-1
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD:?Set LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4231:4222"]

  nats-region-2:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-2
      JS_DOMAIN: region-2
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4232:4222"]

  nats-region-3:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-3
      JS_DOMAIN: region-3
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4233:4222"]

  nats-region-4:
    <<: *region
    environment:
      LEAF_SERVER_NAME: region-4
      JS_DOMAIN: region-4
      LEAF_REMOTE_URL: nats-leaf://${LEAF_USER:-leaf}:${LEAF_PASSWORD}@${HUB_HOST:-nats-hub}:${HUB_LEAF_PORT:-7422}
    ports: ["127.0.0.1:4234:4222"]

  swarm-sim:
    image: ${IMAGE_REGISTRY:-esuo}/swarm-sim:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: java-backend/Dockerfile
      args: {MODULE: swarm-sim}
    profiles: [run]
    # Regions and the report folder are in the entrypoint: `run --rm swarm-sim --branches N` adds to them
    entrypoint: ["java", "-jar", "app.jar", "--report", "/reports",
                 "--nats", "nats://nats-region-1:4222,nats://nats-region-2:4222,nats://nats-region-3:4222,nats://nats-region-4:4222"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${SWARM_HEAP:-2g}
    volumes: ["../../reports/load:/reports"]
    depends_on: [nats-region-1, nats-region-2, nats-region-3, nats-region-4]
