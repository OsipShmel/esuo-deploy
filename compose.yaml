# Local development environment: the center and two branches (b01, b02) on one machine, plus stand-ins for the
# external integrations (notification provider, mobile app).
#
#   cp .env.example .env && docker compose up -d --build
#
# Profiles: monitoring — center observability and branch log shippers; swarm — regional hubs for load tests (with
# observability); swarm-run — swarm-sim as a container; demo — the scenario console behind /demo.
#
# Services come from the deployable stacks via `extends`: the center from deploy/center, a branch from
# deploy/branch/services.yaml, the regions from deploy/loadtest. This file adds only what a single-machine environment
# needs: networks, fixed container names (scripts/ address containers by name), loopback ports, the mocks, the
# per-branch link proxies used for fault injection and the scenario console.
#
# Networks: each branch is isolated and reaches the center only through the `wan` network via its link proxy, the
# same way a branch PC reaches the center over the internet. Cut b01 off: ./scripts/chaos/cut-branch-link.sh b01
name: esuo

x-link: &link
  image: alpine/socat:1.8.0.3
  command: ["-d", "tcp-listen:7422,fork,reuseaddr", "tcp-connect:nats-hub:7422"]
  # unless-stopped: a link cut by scripts/chaos (docker stop) stays cut, while a Docker restart or a sleeping laptop
  # does not leave both branches offline
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ center (deploy/center)
  nats-hub:
    extends: {file: deploy/center/compose.yaml, service: nats-hub}
    container_name: esuo-nats-hub
    environment:
      LEAF_ADVERTISE: center-link:7422
    ports: !override ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222", "127.0.0.1:7422:7422"]
    networks: [center, wan]

  postgres-center:
    extends: {file: deploy/center/compose.yaml, service: postgres-center}
    container_name: esuo-postgres-center
    ports: ["127.0.0.1:${CENTER_DB_PORT:-5435}:5432"]
    networks: [center]

  center-app:
    extends: {file: deploy/center/compose.yaml, service: center-app}
    container_name: esuo-center-app
    ports: !override ["127.0.0.1:${CENTER_PORT:-8081}:8080", "127.0.0.1:${CENTER_MANAGEMENT_PORT:-9081}:9081"]
    networks: [center]

  # ------------------------------------------------------------------ integration mocks
  # Notification provider: POST /chaos {"mode":"error"} simulates an outage (scripts/chaos/notify-down.sh)
  notify-mock:
    build: tools/notify-mock
    container_name: esuo-notify-mock
    ports: ["127.0.0.1:${NOTIFY_MOCK_PORT:-8095}:8090"]
    networks: [center]
    restart: unless-stopped

  # Mobile app: POST /send sends a signed webhook to the center, GET /callbacks lists the callbacks received
  mp-simulator:
    build: tools/mp-simulator
    container_name: esuo-mp-simulator
    environment:
      CENTER_URL: http://center-app:8080
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
    ports: ["127.0.0.1:${MP_SIMULATOR_PORT:-8096}:8091"]
    networks: [center]
    restart: unless-stopped

  # ------------------------------------------------------------------ center observability (monitoring, swarm)
  loki:
    extends: {file: deploy/center/compose.yaml, service: loki}
    container_name: esuo-loki
    profiles: [monitoring, swarm]
    networks: [center]

  grafana:
    extends: {file: deploy/center/compose.yaml, service: grafana}
    container_name: esuo-grafana
    profiles: [monitoring, swarm]
    networks: [center]

  vector-center:
    extends: {file: deploy/center/compose.yaml, service: vector-center}
    container_name: esuo-vector-center
    profiles: [monitoring, swarm]
    networks: [center]

  prometheus:
    extends: {file: deploy/center/compose.yaml, service: prometheus}
    container_name: esuo-prometheus
    profiles: [monitoring, swarm]
    networks: [center]

  nats-exporter:
    extends: {file: deploy/center/compose.yaml, service: nats-exporter}
    container_name: esuo-nats-exporter
    profiles: [monitoring, swarm]
    networks: [center]

  postgres-exporter:
    extends: {file: deploy/center/compose.yaml, service: postgres-exporter}
    container_name: esuo-postgres-exporter
    profiles: [monitoring, swarm]
    networks: [center]

  # ------------------------------------------------------------------ scenario console (demo)
  # Runs scripts/demo/run.sh for the "Scenarios" tab on /demo and streams the output. It holds the Docker socket
  # (link cuts, data loading), so no port is published: the browser reaches it only through a node, as branch admin.
  demo-runner:
    build: tools/demo-runner
    container_name: esuo-demo-runner
    profiles: [demo]
    environment:
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
      NODE: http://node-b01:8080
      NODE2: http://node-b02:8080
      CENTER: http://center-app:8080
      MP: http://mp-simulator:8091
      NOTIFY: http://notify-mock:8090
      HUB_MONITOR: http://nats-hub:8222
      CENTER_ADMIN_LOGIN: ${CENTER_ADMIN_LOGIN:-network}
      CENTER_ADMIN_PASSWORD: ${CENTER_ADMIN_PASSWORD:-}
      TZ: ${BRANCH_TIMEZONE:-Europe/Moscow}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [center, b01, b02]
    restart: unless-stopped

  # ------------------------------------------------------------------ load test (deploy/loadtest)
  # Regional hubs: docker compose --profile swarm up -d. swarm-sim runs from the host (ports 4231–4234) or as a
  # container: docker compose --profile swarm-run run --rm swarm-sim --branches 40000 --duration 10m
  nats-region-1:
    extends: {file: deploy/loadtest/compose.yaml, service: nats-region-1}
    container_name: esuo-nats-region-1
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-2:
    extends: {file: deploy/loadtest/compose.yaml, service: nats-region-2}
    container_name: esuo-nats-region-2
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-3:
    extends: {file: deploy/loadtest/compose.yaml, service: nats-region-3}
    container_name: esuo-nats-region-3
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  nats-region-4:
    extends: {file: deploy/loadtest/compose.yaml, service: nats-region-4}
    container_name: esuo-nats-region-4
    profiles: [swarm, swarm-run]
    depends_on: [nats-hub]
    networks: [center]

  swarm-sim:
    extends: {file: deploy/loadtest/compose.yaml, service: swarm-sim}
    container_name: esuo-swarm-sim
    profiles: [swarm-run]
    networks: [center]

  # ------------------------------------------------------------------ branch b01 (deploy/branch)
  link-b01:
    <<: *link
    container_name: esuo-link-b01
    networks:
      b01: {aliases: [center-link]}
      wan: {}

  nats-leaf-b01:
    extends: {file: deploy/branch/services.yaml, service: nats-leaf}
    container_name: esuo-nats-leaf-b01
    environment:
      LEAF_SERVER_NAME: leaf-b01
      JS_DOMAIN: branch-b01
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: ["leaf-b01-data:/data"]
    ports: ["127.0.0.1:8223:8222"]
    depends_on: [link-b01]
    networks: [b01]

  postgres-b01:
    extends: {file: deploy/branch/services.yaml, service: postgres}
    container_name: esuo-postgres-b01
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["b01-db:/var/lib/postgresql/data"]
    networks: [b01]

  node-b01:
    extends: {file: deploy/branch/services.yaml, service: node-app}
    container_name: esuo-node-b01
    environment:
      DB_URL: jdbc:postgresql://postgres-b01:5432/esuo
      BRANCH_ID: b01
      BRANCH_NAME: Branch 101000 (b01)
      NATS_URL: nats://nats-leaf-b01:4222
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-${CENTER_PUBLIC_URL:-http://localhost:8081}}
      # Scenario console on /demo: needs DEMO_MODE=true and demo-runner (profile demo)
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
    ports: ["127.0.0.1:${NODE_PORT:-8080}:8080"]
    volumes: ["b01-logs:/app/logs"]
    depends_on:
      postgres-b01: {condition: service_healthy}
      nats-leaf-b01: {condition: service_started}
    networks: [b01]

  vector-b01:
    extends: {file: deploy/branch/services.yaml, service: vector}
    container_name: esuo-vector-b01
    environment: {BRANCH_ID: b01, NATS_URL: "nats://nats-leaf-b01:4222"}
    volumes: ["b01-logs:/logs:ro", "vector-b01-data:/var/lib/vector"]
    depends_on: [node-b01, nats-leaf-b01]          # node-app creates the log volume (owned by app); vector only reads
    networks: [b01]

  # ------------------------------------------------------------------ branch b02 (deploy/branch)
  link-b02:
    <<: *link
    container_name: esuo-link-b02
    networks:
      b02: {aliases: [center-link]}
      wan: {}

  nats-leaf-b02:
    extends: {file: deploy/branch/services.yaml, service: nats-leaf}
    container_name: esuo-nats-leaf-b02
    environment:
      LEAF_SERVER_NAME: leaf-b02
      JS_DOMAIN: branch-b02
      LEAF_REMOTE_URL: nats-leaf://leaf:${LEAF_PASSWORD}@center-link:7422
    volumes: ["leaf-b02-data:/data"]
    ports: ["127.0.0.1:8224:8222"]
    depends_on: [link-b02]
    networks: [b02]

  postgres-b02:
    extends: {file: deploy/branch/services.yaml, service: postgres}
    container_name: esuo-postgres-b02
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["b02-db:/var/lib/postgresql/data"]
    networks: [b02]

  node-b02:
    extends: {file: deploy/branch/services.yaml, service: node-app}
    container_name: esuo-node-b02
    environment:
      DB_URL: jdbc:postgresql://postgres-b02:5432/esuo
      BRANCH_ID: b02
      BRANCH_NAME: Branch 102000 (b02)
      NATS_URL: nats://nats-leaf-b02:4222
      QR_PUBLIC_BASE_URL: ${QR_PUBLIC_BASE_URL:-${CENTER_PUBLIC_URL:-http://localhost:8081}}
      DEMO_RUNNER_URL: ${DEMO_RUNNER_URL:-http://demo-runner:8099}
      DEMO_RUNNER_TOKEN: ${DEMO_RUNNER_TOKEN:-${JWT_SECRET}}
    ports: ["127.0.0.1:8090:8080"]
    volumes: ["b02-logs:/app/logs"]
    depends_on:
      postgres-b02: {condition: service_healthy}
      nats-leaf-b02: {condition: service_started}
    networks: [b02]

  vector-b02:
    extends: {file: deploy/branch/services.yaml, service: vector}
    container_name: esuo-vector-b02
    environment: {BRANCH_ID: b02, NATS_URL: "nats://nats-leaf-b02:4222"}
    volumes: ["b02-logs:/logs:ro", "vector-b02-data:/var/lib/vector"]
    depends_on: [node-b02, nats-leaf-b02]
    networks: [b02]

networks:
  center:
  wan:
  b01:
  b02:

volumes:
  hub-data:
  center-db:
  center-dumps:
  center-logs:
  vector-center-data:
  leaf-b01-data:
  b01-db:
  leaf-b02-data:
  b02-db:
  b01-logs:
  b02-logs:
  vector-b01-data:
  vector-b02-data:
  loki-data:
  grafana-data:
  prometheus-data:
