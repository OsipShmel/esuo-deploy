[project]
name = "esuo-ml"
version = "0.1.0"
description = "ЕСУО: синтетический мир, обучение модели длительности обслуживания и отчёт (офлайн)"
requires-python = ">=3.11"

# Никаких зависимостей в рантайме: только стандартная библиотека.
# Это сознательное решение, как у mp-simulator и notify-mock (дизайн-док 3.2): код обучения читается
# глазами на защите, ставится одной командой и не тянет колёса под конкретную платформу.
dependencies = []

[project.scripts]
esuo-ml = "esuo_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esuo_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
